name: Generate Pacman Graph
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Pacman SVG
        uses: liununu/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          output_name: "pacman"
          output_dir: "dist"
          theme: "gradient"
          show_total: "true"

      - name: Commit and Push
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: output
          directory: dist
