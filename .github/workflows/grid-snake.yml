name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # Runs twice a day
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: siddiq01  # <-- change this to your GitHub username
          outputs: |
            dist/pacman.svg
            dist/pacman-dark.svg
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
